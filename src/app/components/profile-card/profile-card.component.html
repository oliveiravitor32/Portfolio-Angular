<article class="profile-card">
	<section class="profile-card__details-wrapper">
		<h1 class="profile-card__title">
			Olá, eu sou <span class="profile-card__highlight">Vitor Oliveira</span>
		</h1>
		<p class="profile-card__role">
			Desenvolvedor Fullstack · Angular &amp; Spring Boot
		</p>
		<p class="profile-card__text">
			Transformo ideias em aplicações web modernas, rápidas e escaláveis — do
			componente na tela à API que sustenta tudo.
		</p>
		<ul
			class="profile-card__stack tech-chips"
			aria-label="Principais tecnologias"
		>
			<li class="tech-chip">Angular</li>
			<li class="tech-chip">React</li>
			<li class="tech-chip">Vue.js</li>
			<li class="tech-chip">TypeScript</li>
			<li class="tech-chip">Java</li>
			<li class="tech-chip">Spring Boot</li>
		</ul>
		<section class="profile-card__actions-wrapper">
			<a
				class="profile-card__action-link profile-card__action-link--button"
				href="assets/files/resume.pdf"
				target="_blank"
				rel="noopener"
				aria-label="Baixar meu currículo"
				>Currículo
				<svg
					class="profile-card__icon"
					width="16"
					height="16"
					aria-hidden="true"
				>
					<use
						xlink:href="assets/icons/file-download-icon.svg#file-download-icon"
					></use>
				</svg>
			</a>
			<app-social-links></app-social-links>
		</section>
	</section>
	<img
		class="profile-card__image"
		ngSrc="assets/images/profile.jpg"
		width="164"
		height="164"
		priority
		alt="Minha foto de perfil"
	/>
</article>
